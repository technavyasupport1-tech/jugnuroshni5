# ---------------------------------------------------------------
# Decap CMS configuration — JURO website
# Login: GitHub account (via Netlify's GitHub OAuth provider).
# Every "Publish" creates a commit in GitHub -> Netlify rebuilds the site.
# >>> Replace REPLACE_WITH_GITHUB_USERNAME/jugnuroshni-website with your repo <<<
# ---------------------------------------------------------------
backend:
  name: github
  repo: technavyasupport1-tech/jugnuroshni5
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    update: "Website update: {{collection}} — {{slug}}"
    uploadMedia: "Upload image: {{path}}"
    deleteMedia: "Delete image: {{path}}"

site_url: https://www.jugnuroshni.com
display_url: https://www.jugnuroshni.com
logo_url: /images/brand/juro-logo.png
locale: en

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: pages
    label: "Website Pages"
    description: "Edit the text and images on each page. Click Publish to put changes live (takes 1–2 minutes)."
    editor: { preview: false }
    files:
      # ---------------- HOME ----------------
      - name: home
        label: "Home Page"
        file: content/home.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - name: hero
            label: "Top banner"
            widget: object
            fields:
              - { name: eyebrow, label: "Small text above heading", widget: string }
              - { name: heading, label: "Main heading (press Enter for a new line)", widget: text }
              - { name: subheading, label: "Sub heading", widget: text }
              - { name: primaryButton, label: "Main button text", widget: string }
              - { name: secondaryButton, label: "Second button text", widget: string }
              - { name: slideSeconds, label: "Banner image change time (seconds, e.g. 3)", widget: number, value_type: float, min: 2, max: 10, required: false, default: 3 }
              - name: slides
                label: "Banner images (one is chosen at random on each visit, then they rotate)"
                label_singular: "Banner image"
                widget: list
                min: 1
                summary: "{{fields.label}}"
                fields:
                  - { name: image, label: "Image (landscape, at least 1920×1080 recommended)", widget: image }
                  - { name: alt, label: "Image description (for Google & accessibility)", widget: string }
                  - { name: label, label: "Caption shown under the banner", widget: string, required: false }
          - name: intro
            label: "Who we are section"
            widget: object
            fields:
              - { name: eyebrow, label: "Small label", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: text, label: "Text (leave a blank line between paragraphs)", widget: text }
              - { name: image, label: "Image", widget: image }
              - { name: imageAlt, label: "Image description", widget: string }
          - name: introBadge
            label: "Badge on intro image (leave Value empty to hide)"
            widget: object
            fields:
              - { name: label, label: "Small label (e.g. Est.)", widget: string, required: false }
              - { name: value, label: "Value (e.g. 2023)", widget: string, required: false }
              - { name: place, label: "Small text below", widget: string, required: false }
          - name: introButtons
            label: "Intro section buttons"
            widget: object
            fields:
              - { name: primary, label: "First button text", widget: string }
              - { name: secondary, label: "Second button text", widget: string }
          - name: stats
            label: "Numbers in banner (only use verified figures)"
            label_singular: "Number"
            widget: list
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            fields:
              - { name: value, label: "Number", widget: number, value_type: int }
              - { name: suffix, label: "After number (e.g. + or sq ft)", widget: string, required: false }
              - { name: label, label: "Label", widget: string }
              - { name: plain, label: "Show without counting animation (use for years)", widget: boolean, required: false, default: false }
          - name: trust
            label: "Trust strip (below banner)"
            label_singular: "Item"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: icon, label: Icon, widget: select, options: ["machines", "drawing", "shield", "factory"] }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: string }
          - { name: productsEyebrow, label: "Products section small label", widget: string }
          - { name: productsHeading, label: "Products section heading", widget: string }
          - { name: productsText, label: "Products section text", widget: text }
          - { name: whyEyebrow, label: "Strengths small label", widget: string }
          - { name: whyHeading, label: "Strengths heading", widget: string }
          - { name: whyText, label: "Strengths text (left side)", widget: text }
          - name: why
            label: "Strengths"
            label_singular: "Strength"
            widget: list
            summary: "{{fields.title}}"
            fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
          - { name: processHeading, label: "Process heading", widget: string }
          - { name: processEyebrow, label: "Process small label", widget: string }
          - name: process
            label: "Process steps"
            label_singular: "Step"
            widget: list
            summary: "{{fields.title}}"
            fields: [{ name: title, label: Title, widget: string }, { name: text, label: Text, widget: text }]
          - { name: industriesHeading, label: "Industries heading", widget: string }
          - { name: industries, label: "Industries served", widget: list, field: { name: item, label: Industry, widget: string } }
          - { name: testimonialsEyebrow, label: "Testimonials small label", widget: string }
          - { name: testimonialsHeading, label: "Testimonials heading", widget: string }
          - name: testimonials
            label: "Customer testimonials (section stays hidden until you add one — use only real, approved quotes)"
            label_singular: "Testimonial"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: quote, label: "Quote", widget: text }
              - { name: name, label: "Person's name", widget: string }
              - { name: role, label: "Designation", widget: string, required: false }
              - { name: company, label: "Company", widget: string, required: false }
          - { name: faqHeading, label: "FAQ heading", widget: string }
          - { name: faqEyebrow, label: "FAQ small label", widget: string }
          - { name: faqText, label: "FAQ text (left side)", widget: string }
          - { name: faqButton, label: "FAQ button text", widget: string }
          - name: faq
            label: "FAQ (questions & answers)"
            label_singular: "Question"
            widget: list
            summary: "{{fields.q}}"
            fields: [{ name: q, label: Question, widget: string }, { name: a, label: Answer, widget: text }]
          - name: cta
            label: "Call-to-action band (bottom of every page)"
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: button, label: "Button text", widget: string }

      # ---------------- PRODUCTS ----------------
      - name: products
        label: "Products Page (add / edit / delete products)"
        file: content/products.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - { name: bannerImage, label: "Page banner image", widget: image }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Introduction", widget: text }
          - { name: gridHeading, label: "Product grid heading", widget: string }
          - { name: gridEyebrow, label: "Product grid small label", widget: string }
          - { name: gridText, label: "Product grid text", widget: text }
          - name: products
            label: "Products (each product gets its own page)"
            label_singular: "Product"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Product name", widget: string }
              - { name: slug, label: "Page link id (lowercase-with-dashes, e.g. concealed-light-housing)", widget: string, pattern: ['^[a-z0-9-]+$', "Only lowercase letters, numbers and dashes"] }
              - name: category
                label: "Category"
                widget: select
                options:
                  - { label: "Lighting Housings & Components", value: "lighting-housings" }
                  - { label: "Electrical Accessory Housings", value: "electrical-housings" }
                  - { label: "Turned Components", value: "turned-components" }
                  - { label: "Sheet Metal Components", value: "sheet-metal-components" }
                  - { label: "Press Tools", value: "press-tools" }
                  - { label: "Elevator Components & Accessories", value: "elevator-components" }
                  - { label: "Industrial Fabrication & Job Work", value: "fabrication-job-work" }
              - { name: featured, label: "Show on Home page (max 8 products)", widget: boolean, required: false, default: false }
              - { name: image, label: "Main photo (shown on cards and at the top of the product page)", widget: image, required: false }
              - { name: gallery, label: "More photos (gallery on the product page)", widget: list, required: false, field: { name: image, label: Photo, widget: image } }
              - { name: description, label: "Short description (1–2 lines, shown on cards)", widget: text }
              - { name: overview, label: "Full description (product page)", widget: text, required: false }
              - name: specs
                label: "Specifications table"
                label_singular: "Specification"
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields: [{ name: label, label: "Name (e.g. Outer diameter)", widget: string }, { name: value, label: "Value (e.g. 110 mm)", widget: string }]
              - { name: parts, label: "Parts / range list", widget: list, required: false, field: { name: item, label: Part, widget: string } }
              - { name: readyImage, label: "Finished product photo (optional)", widget: image, required: false }
              - { name: readyCaption, label: "Finished product caption", widget: text, required: false }
          - { name: categoriesHeading, label: "Categories section heading", widget: string }
          - { name: categoriesText, label: "Categories section text", widget: text }
          - { name: categoriesEyebrow, label: "Categories small label", widget: string }
          - name: categories
            label: "Product categories (detailed sections)"
            label_singular: "Category"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Category name", widget: string }
              - { name: slug, label: "Link id (do not change for existing categories)", widget: string, pattern: ['^[a-z0-9-]+$', "Only lowercase letters, numbers and dashes"] }
              - { name: filterLabel, label: "Short name on filter button", widget: string }
              - { name: category, label: "Group", widget: select, options: ["Industrial Products", "Fabrication Services"] }
              - { name: summary, label: "Short summary (1 line)", widget: string }
              - { name: seoDescription, label: "Google description for this category page", widget: text, required: false }
              - { name: bannerImage, label: "Category page banner image", widget: image, required: false }
              - { name: description, label: "Full description", widget: text }
              - { name: items, label: "Range includes (list)", widget: list, required: false, field: { name: item, label: Item, widget: string } }
              - { name: industries, label: "Industries served (list, optional)", widget: list, required: false, field: { name: item, label: Industry, widget: string } }
              - { name: image, label: "Main image (leave empty to show an illustration)", widget: image, required: false }
              - { name: gallery, label: "Gallery images", widget: list, required: false, field: { name: image, label: Image, widget: image } }
          - { name: featuresHeading, label: "Features heading", widget: string }
          - { name: features, label: "Features", widget: list, field: { name: item, label: Feature, widget: string } }

          - { name: featuresEyebrow, label: "Features small label", widget: string }
          - { name: featuresText, label: "Features text", widget: text }

      # ---------------- ABOUT ----------------
      - name: about
        label: "About Us Page"
        file: content/about.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - { name: bannerImage, label: "Page banner image", widget: image }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Banner sub text", widget: string }
          - { name: storyEyebrow, label: "Story small label", widget: string }
          - { name: storyHeading, label: "Story heading", widget: string }
          - { name: story, label: "Company story (blank line between paragraphs)", widget: text }
          - { name: storyImage, label: "Story image", widget: image }
          - name: leader
            label: "Mentor / Director"
            widget: object
            fields: [{ name: name, label: Name, widget: string }, { name: role, label: Role, widget: string }, { name: text, label: Text, widget: text }]
          - { name: vision, label: "Vision statement", widget: text }
          - { name: visionEyebrow, label: "Vision small label", widget: string }
          - { name: factEyebrow, label: "Fact sheet small label", widget: string }
          - { name: factHeading, label: "Fact sheet heading", widget: string }
          - name: factSheet
            label: "Fact sheet"
            label_singular: "Fact"
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields: [{ name: label, label: Label, widget: string }, { name: value, label: Value, widget: string }]
          - { name: teamHeading, label: "Team heading", widget: string }
          - { name: teamEyebrow, label: "Team small label", widget: string }
          - { name: teamText, label: "Team text", widget: text }
          - { name: team, label: "Team roles", widget: list, field: { name: item, label: Role, widget: string } }
          - { name: infraTeaserHeading, label: "Infrastructure box heading", widget: string }
          - { name: infraTeaserText, label: "Infrastructure box text", widget: text }
          - { name: infraTeaserButton, label: "Infrastructure box button", widget: string }

      # ---------------- INFRASTRUCTURE ----------------
      - name: infrastructure
        label: "Infrastructure & Quality Page"
        file: content/infrastructure.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - { name: bannerImage, label: "Page banner image", widget: image }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Introduction", widget: text }
          - { name: capabilitiesEyebrow, label: "Capabilities small label", widget: string }
          - { name: capabilitiesHeading, label: "Capabilities heading", widget: string }
          - name: capabilities
            label: "Capabilities"
            label_singular: "Capability"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: icon, label: Icon, widget: select, options: ["turning", "press", "drill", "grind", "weld", "power"] }
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
          - { name: machinesEyebrow, label: "Machines small label", widget: string }
          - { name: machinesHeading, label: "Machines heading", widget: string }
          - { name: machinesText, label: "Machines text", widget: text }
          - name: machines
            label: "Machines"
            label_singular: "Machine"
            widget: list
            summary: "{{fields.qty}} × {{fields.name}}"
            fields: [{ name: name, label: "Machine", widget: string }, { name: qty, label: "Quantity", widget: string }]
          - name: facts
            label: "Works facts"
            label_singular: "Fact"
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields: [{ name: label, label: Label, widget: string }, { name: value, label: Value, widget: string }]
          - { name: qualityEyebrow, label: "Quality small label", widget: string }
          - { name: qualityHeading, label: "Quality heading", widget: string }
          - { name: qualityText, label: "Quality text", widget: text }
          - { name: rawMaterialText, label: "Raw material text", widget: text }
          - { name: qualityChecks, label: "Quality checks", widget: list, field: { name: item, label: Check, widget: string } }
          - { name: certificationsNote, label: "Certifications (only real certificates, e.g. ISO 9001:2015 — leave empty if none)", widget: text, required: false }

      # ---------------- CUSTOMERS ----------------
      - name: customers
        label: "Our Customers Page"
        file: content/customers.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - { name: bannerImage, label: "Page banner image", widget: image }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Introduction", widget: text }
          - { name: listEyebrow, label: "List small label", widget: string }
          - { name: listHeading, label: "List heading", widget: string }
          - { name: listText, label: "List text", widget: text }
          - name: customers
            label: "Customers"
            label_singular: "Customer"
            widget: list
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { name: name, label: "Company name", widget: string }
              - { name: location, label: "City", widget: string }
              - { name: note, label: "Note (division / group, optional)", widget: string, required: false }
              - { name: logo, label: "Customer logo (optional — only with permission)", widget: image, required: false }
          - { name: disclaimer, label: "Small note under list", widget: string }
          - { name: ctaHeading, label: "Bottom box heading", widget: string }
          - { name: ctaText, label: "Bottom box text", widget: text }
          - { name: ctaButton, label: "Bottom box button", widget: string }

      # ---------------- CONTACT ----------------
      - name: contact
        label: "Contact Us Page"
        file: content/contact.json
        fields:
          - { name: seoTitle, label: "Google title (SEO)", widget: string }
          - { name: seoDescription, label: "Google description (SEO)", widget: text }
          - { name: bannerImage, label: "Page banner image", widget: image }
          - { name: heading, label: "Page heading", widget: string }
          - { name: intro, label: "Introduction", widget: text }
          - { name: formHeading, label: "Form heading", widget: string }
          - { name: formText, label: "Form help text", widget: text }
          - { name: successMessage, label: "Thank-you page message", widget: text }
          - { name: otherOption, label: "Extra option in product list", widget: string }
          - { name: sideHeading, label: "Direct contact box heading", widget: string }
          - { name: locationsEyebrow, label: "Locations small label", widget: string }
          - { name: locationsHeading, label: "Locations heading", widget: string }

  - name: settings
    label: "Company Details & Contact Info"
    editor: { preview: false }
    files:
      - name: settings
        label: "Company Details (phone, WhatsApp, email, addresses)"
        file: content/settings.json
        fields:
          - { name: siteUrl, label: "Website address (e.g. https://www.jugnuroshni.com)", widget: string }
          - { name: companyName, label: "Company name", widget: string }
          - { name: brandName, label: "Brand name", widget: string }
          - { name: logo, label: "Logo (PNG with transparent background)", widget: image }
          - { name: tagline, label: "Tagline", widget: string }
          - { name: topbarText, label: "Top bar text (above menu)", widget: string }
          - { name: headerButton, label: "Menu button text", widget: string }
          - { name: floatingButton, label: "Floating side button text (all pages)", widget: string }
          - { name: marqueeTitle, label: "Customer scroll strip label", widget: string }
          - { name: ctaEyebrow, label: "Bottom call-to-action small label", widget: string }
          - { name: shortDescription, label: "Short description", widget: text }
          - { name: email, label: "Email", widget: string }
          - { name: whatsappNumber, label: "WhatsApp number — country code + number, digits only (e.g. 919045506413)", widget: string, pattern: ['^[0-9]{10,15}$', "Digits only, include 91 country code"] }
          - { name: whatsappGreeting, label: "Default WhatsApp message", widget: string }
          - name: contacts
            label: "Contact persons"
            label_singular: "Contact person"
            widget: list
            summary: "{{fields.name}} — {{fields.phone}}"
            fields: [{ name: name, label: Name, widget: string }, { name: role, label: "Role / title", widget: string, required: false }, { name: phone, label: Phone, widget: string }]
          - name: addresses
            label: "Addresses"
            label_singular: "Address"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Label (e.g. Head Office)", widget: string }
              - { name: lines, label: "Address (press Enter for new line)", widget: text }
              - { name: mapQuery, label: "Google Maps search text", widget: string }
          - { name: workingHours, label: "Working hours", widget: string }
          - { name: footerNote, label: "Footer text", widget: text }
