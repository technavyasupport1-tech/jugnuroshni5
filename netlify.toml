[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Clean URLs are generated as folders (/about/ etc). Friendly aliases:
[[redirects]]
  from = "/services/*"
  to = "/products/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/products/"
  status = 301
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/our-customers"
  to = "/customers/"
  status = 301
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
